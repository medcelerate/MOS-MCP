<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOS-MCP Console</title>
<link rel="stylesheet" href="tailwind.css" />
</head>
<body class="m-0 font-sans bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
<header class="px-5 py-4 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-baseline gap-3 flex-wrap">
  <h1 class="text-lg font-semibold m-0">MOS-MCP Console</h1>
  <span class="text-sm text-slate-500 dark:text-slate-400" id="identity">…</span>
  <span class="pill" id="profiles"></span>
  <span class="pill" id="device"></span>
</header>

<main class="max-w-4xl mx-auto p-5 grid gap-5">
  <section class="card">
    <div class="flex gap-3 items-center mb-3 flex-wrap">
      <h2 class="text-base font-semibold m-0 flex-1">Peers</h2>
      <button class="btn" onclick="refresh()">Refresh</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm border-collapse">
        <thead><tr>
          <th class="th">Name</th><th class="th">Host</th>
          <th class="th">Ports (L/U/Q)</th><th class="th">Connected</th><th class="th"></th>
        </tr></thead>
        <tbody id="peers"></tbody>
      </table>
    </div>
    <div id="peerMsg" class="msg hidden"></div>
  </section>

  <section class="card">
    <h2 class="text-base font-semibold mt-0 mb-3">Add / update peer</h2>
    <form id="peerForm" onsubmit="return addPeer(event)"
          class="grid gap-2 items-end" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
      <div><label class="lbl">Name</label><input class="inp" name="name" required placeholder="vizrt" /></div>
      <div><label class="lbl">Host</label><input class="inp" name="host" required placeholder="10.0.0.5" /></div>
      <div><label class="lbl">Lower port</label><input class="inp" name="lowerPort" type="number" placeholder="10540" /></div>
      <div><label class="lbl">Upper port</label><input class="inp" name="upperPort" type="number" placeholder="10541" /></div>
      <div><label class="lbl">Query port</label><input class="inp" name="queryPort" type="number" placeholder="10542" /></div>
      <div class="flex gap-2">
        <button type="button" class="btn" onclick="testPeer()">Test</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
    <div id="testMsg" class="msg hidden"></div>
    <pre id="testOut" class="code hidden"></pre>
  </section>

  <section class="card">
    <div class="flex gap-3 items-center mb-3 flex-wrap">
      <h2 class="text-base font-semibold m-0 flex-1">Inbox <span class="text-slate-500 dark:text-slate-400" id="inboxCount"></span></h2>
      <button class="btn" onclick="loadInbox()">Refresh</button>
    </div>
    <div id="inbox" class="text-slate-500 dark:text-slate-400 text-sm">No messages.</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}
function flash(el, ok, text) {
  el.className = "msg " + (ok ? "msg-ok" : "msg-err");
  el.textContent = text;
}
function form2peer() {
  const f = $("peerForm");
  const num = (v) => v ? parseInt(v, 10) : 0;
  return {
    name: f.name.value.trim(), host: f.host.value.trim(),
    lowerPort: num(f.lowerPort.value), upperPort: num(f.upperPort.value), queryPort: num(f.queryPort.value),
  };
}

async function refresh() {
  try {
    const st = await api("/api/status");
    $("identity").textContent = `mosID=${st.identity.mosID}  ncsID=${st.identity.ncsID}`;
    $("profiles").textContent = "profiles " + (st.enabledProfiles || "");
    $("device").textContent = st.deviceActive ? "device: listening" : "device: off";
    const peers = st.peers || [];
    $("peers").innerHTML = peers.length ? peers.map(p => `
      <tr>
        <td class="td">${esc(p.name)}</td>
        <td class="td">${esc(p.host)}</td>
        <td class="td">${p.lowerPort}/${p.upperPort}/${p.queryPort}</td>
        <td class="td">
          <span class="dot ${p.lowerConnected?'dot-on':'dot-off'}"></span> L
          <span class="dot ${p.upperConnected?'dot-on':'dot-off'}"></span> U
          <span class="dot ${p.queryConnected?'dot-on':'dot-off'}"></span> Q
        </td>
        <td class="td whitespace-nowrap">
          <button class="btn" onclick='fillPeer(${JSON.stringify(p)})'>Edit</button>
          <button class="btn btn-danger" onclick="delPeer('${esc(p.name)}')">Delete</button>
        </td>
      </tr>`).join("") : `<tr><td class="td text-slate-500 dark:text-slate-400" colspan="5">No peers configured.</td></tr>`;
  } catch (e) { flash($("peerMsg"), false, e.message); }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fillPeer(p) {
  const f = $("peerForm");
  f.name.value = p.name; f.host.value = p.host;
  f.lowerPort.value = p.lowerPort || ""; f.upperPort.value = p.upperPort || ""; f.queryPort.value = p.queryPort || "";
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}
async function addPeer(ev) {
  ev.preventDefault();
  try {
    await api("/api/peers", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(form2peer()) });
    flash($("peerMsg"), true, "Peer saved.");
    $("peerForm").reset(); refresh();
  } catch (e) { flash($("peerMsg"), false, e.message); }
  return false;
}
async function delPeer(name) {
  if (!confirm(`Delete peer "${name}"?`)) return;
  try { await api("/api/peers?name=" + encodeURIComponent(name), { method: "DELETE" }); refresh(); }
  catch (e) { flash($("peerMsg"), false, e.message); }
}
async function testPeer() {
  $("testOut").classList.add("hidden");
  flash($("testMsg"), true, "Testing…");
  try {
    const r = await api("/api/peers/test", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(form2peer()) });
    if (r.reachable && !r.error) {
      const profs = (r.machineInfo && r.machineInfo.supportedProfiles && r.machineInfo.supportedProfiles.mosProfile || [])
        .map(p => p.number).join(",");
      flash($("testMsg"), true, `Reachable. ${r.machineInfo ? "model="+(r.machineInfo.model||"?")+" profiles="+profs : ""}`);
    } else {
      flash($("testMsg"), false, r.error || "Not reachable.");
    }
    $("testOut").textContent = JSON.stringify(r, null, 2);
    $("testOut").className = "code";
  } catch (e) { flash($("testMsg"), false, e.message); }
}
async function loadInbox() {
  try {
    const items = await api("/api/inbox?limit=50");
    $("inboxCount").textContent = items.length ? `(${items.length})` : "";
    $("inbox").innerHTML = items.length ? items.map(m => `
      <details class="mb-1.5">
        <summary class="cursor-pointer"><strong>${esc(m.type)}</strong> <span class="text-slate-500 dark:text-slate-400">from ${esc(m.peer)} · ${new Date(m.received).toLocaleString()}</span></summary>
        <pre class="code">${esc(m.xml)}</pre>
      </details>`).join("") : `<span class="text-slate-500 dark:text-slate-400">No messages.</span>`;
  } catch (e) { $("inbox").textContent = e.message; }
}
refresh(); loadInbox();
setInterval(refresh, 5000);
</script>
</body>
</html>
